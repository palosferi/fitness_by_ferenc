<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0b;
    --card: #141518;
    --line: #232428;
    --text: #f2f2f3;
    --muted: #8b8d94;
    --blue: #5b8def;
    --red: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 22px;
    width: 100%;
    max-width: 340px;
  }
  h1 { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.45; }
  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    background: #0e0f11;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
    font-size: 16px; /* 16px keeps iOS from zooming on focus */
    padding: 11px 12px;
    margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%;
    background: var(--blue);
    color: #08111f;
    border: none;
    border-radius: 10px;
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    padding: 12px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .error {
    background: #3a1a1a;
    border: 1px solid var(--red);
    border-radius: 10px;
    color: #ff8a8a;
    font-size: 13px;
    padding: 10px 12px;
    margin-bottom: 18px;
    line-height: 1.45;
  }
  .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="sub">Shows your real Garmin data instead of the public demo.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>

    <a class="back" href="{{ url_for('dashboard.dashboard') }}">Back to the demo dashboard</a>
  </main>
</body>
</html>
