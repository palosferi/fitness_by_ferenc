# Ban IPs that keep failing dashboard logins.
#
# The app already throttles in-process (AUTH_MAX_ATTEMPTS / AUTH_LOCKOUT_
# SECONDS), but that only refuses the request - the attacker keeps knocking.
# This drops them at the firewall instead, and survives a service restart.
#
# Install:
#   sudo cp systemd/fail2ban/filter.d/fitness-dashboard.conf /etc/fail2ban/filter.d/
#   sudo cp systemd/fail2ban/jail.d/fitness-dashboard.conf /etc/fail2ban/jail.d/
#   sudo systemctl restart fail2ban
#   sudo fail2ban-client status fitness-dashboard
[fitness-dashboard]
enabled  = true
backend  = systemd
journalmatch = _SYSTEMD_UNIT=fitness-dashboard.service
filter   = fitness-dashboard
maxretry = 8
findtime = 600
bantime  = 3600
